<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thống kê Đoàn viên – Khoa Ngoại ngữ</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1b2437;--mut:#667085;--line:#e1e6ef;--pri:#1f5fbf;--pri2:#e8f0fd;--ok:#127a43;--okb:#e3f6ec;--warn:#a15c00;--warnb:#fff2dc;--bad:#b42318;--badb:#fde8e6;--gray:#475467;--grayb:#eceff4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",Roboto,Arial,sans-serif}
header{background:#12306b;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:650;flex:1;min-width:220px}
header small{opacity:.75;font-weight:400;display:block;font-size:12px}
nav{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 14px;overflow:auto;position:sticky;top:0;z-index:5}
nav button{border:0;background:none;padding:12px 16px;font:inherit;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--pri);border-color:var(--pri)}
main{max-width:1320px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-size:26px;line-height:1.1}.stat span{color:var(--mut);font-size:12.5px}
.stat.ok b{color:var(--ok)}.stat.warn b{color:var(--warn)}.stat.bad b{color:var(--bad)}.stat.pri b{color:var(--pri)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut);font-weight:600}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid #c9d1df;border-radius:7px;background:#fff;color:var(--ink);min-width:0}
button.b{font:inherit;font-weight:600;padding:7px 13px;border-radius:7px;border:1px solid #c9d1df;background:#fff;cursor:pointer;color:var(--ink)}
button.b:hover{background:#f1f4f9}button.p{background:var(--pri);border-color:var(--pri);color:#fff}button.p:hover{background:#184c99}
button.d{color:var(--bad);border-color:#f0b8b2}button:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border:1px solid #c9d1df;border-radius:99px;background:#fff;cursor:pointer;font-weight:600;color:var(--gray)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:560px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#f0f3f9;position:sticky;top:0;z-index:1;font-size:12px;text-transform:none}
td.n,th.n{text-align:right}td.c,th.c{text-align:center}
tr.sub td{background:#f6f8fc;font-weight:700}tr.tot td{background:#e8f0fd;font-weight:700}
tr.click{cursor:pointer}tr.click:hover td{background:#f7faff}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:650}
.t-dat{background:var(--okb);color:var(--ok)}.t-chuadat{background:var(--warnb);color:var(--warn)}.t-chua{background:var(--grayb);color:var(--gray)}.t-loi{background:var(--badb);color:var(--bad)}
.note{color:var(--mut);font-size:12.5px}.warnbox{background:var(--warnb);border:1px solid #f1d49b;color:#6b3f00;padding:9px 12px;border-radius:8px;margin-bottom:12px;font-size:13px}
.bar{height:8px;background:var(--grayb);border-radius:9px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--ok)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:50}
.modal>div{background:#fff;border-radius:12px;max-width:980px;width:100%;padding:18px 20px}
.modal h3{margin:0 0 10px}.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.ok-t{color:var(--ok);font-weight:650}.bad-t{color:var(--bad);font-weight:650}.warn-t{color:var(--warn);font-weight:650}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#12306b;color:#fff;padding:10px 18px;border-radius:9px;z-index:99;max-width:90vw}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:8px}
.hide{display:none!important}
.adminonly{display:none}body.admin .adminonly{display:revert}body.admin button.adminonly{display:inline-block}
@media(max-width:640px){main{padding:12px 10px}}
</style>
</head>
<body>
<header>
  <h1>Thống kê Đoàn viên<small>Đoàn khoa Ngoại ngữ · Khóa 2023 – 2026</small></h1>
  <a class="b" style="color:#fff;text-decoration:none;opacity:.85" href="https://quanlydoanvien.doanthanhnien.vn" target="_blank" rel="noopener">Mở hệ thống YUM ↗</a>
  <span id="adminState" class="note" style="color:#cfe0ff"></span>
  <button class="b" id="btnAdmin">🔐 Đăng nhập Admin</button>
</header>
<nav id="tabs">
  <button data-t="overview" class="on">Tổng quan đoàn viên</button>
  <button data-t="contest">Thống kê cuộc thi</button>
  <button data-t="errors">Đoàn viên bị lỗi</button>
  <button data-t="data" class="adminonly">Dữ liệu &amp; Sao lưu</button>
</nav>
<main>
<section id="tab-overview"></section>
<section id="tab-contest" class="hide"></section>
<section id="tab-errors" class="hide"></section>
<section id="tab-data" class="hide"></section>
</main>
<div id="modalRoot"></div>
<script src="vendor/exceljs.min.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="data.js"></script>
<script>
"use strict";
/* ========== tiện ích ========== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nz=s=>String(s||'').normalize('NFC').replace(/\s+/g,' ').trim().toUpperCase();
const noAcc=s=>nz(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/Đ/g,'D');
const khoaOf=c=>{const m=/(\d{2})[A-Z]?$/.exec(c||'');return m?2000+ +m[1]:0};
const pad=n=>String(n).padStart(2,'0');
const fmtNow=()=>{const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())} ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`};
const fmtIso=s=>{const d=new Date(s);return isNaN(d)?'':`${pad(d.getHours())}:${pad(d.getMinutes())} ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`};
const stamp=()=>{const d=new Date();return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`};
const titleCase=s=>String(s||'').toLowerCase().replace(/(^|\s)(\S)/gu,(m,a,b)=>a+b.toUpperCase());
function toast(msg,ms=3200){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function modal(html,onMount){const r=$('#modalRoot');r.innerHTML=`<div class="modal"><div>${html}</div></div>`;onMount&&onMount(r);return r}
const closeModal=()=>$('#modalRoot').innerHTML='';
function hashStr(s){ // SHA-256 nếu có, nếu không dùng hash đơn giản
  if(window.crypto&&crypto.subtle){return crypto.subtle.digest('SHA-256',new TextEncoder().encode('yum|'+s)).then(b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''))}
  let h=5381;for(const c of 'yum|'+s)h=((h<<5)+h+c.charCodeAt(0))|0;return Promise.resolve('x'+h)}

/* ========== lưu trữ IndexedDB ========== */
const IDB={db:null,open(){return new Promise((res,rej)=>{const q=indexedDB.open('yum-thongke',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{this.db=q.result;res()};q.onerror=()=>rej(q.error)})},
 get(k){return new Promise(r=>{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(undefined)})},
 set(k,v){return new Promise((res,rej)=>{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}};

function pick(accept,multiple,cb){const i=document.createElement('input');i.type='file';i.accept=accept;i.multiple=!!multiple;i.style.display='none';document.body.appendChild(i);i.onchange=async()=>{const f=[...i.files];i.remove();if(f.length)await cb(f)};i.click()}
/* ========== trạng thái ========== */
let S={members:[],errors:[],contests:[],registry:[],settings:{pwd:null,lastBackup:null}};
let admin=false, snaps=[];
const clone=o=>JSON.parse(JSON.stringify(o));
const dataOnly=()=>({app:'yum-thongke',version:1,exportedAt:new Date().toISOString(),members:S.members,errors:S.errors,contests:S.contests,registry:S.registry});
async function persist(){await IDB.set('state',S)}
async function commit(label){ // tự động sao lưu trạng thái TRƯỚC khi thay đổi
  snaps.unshift({time:new Date().toISOString(),label,json:JSON.stringify(dataOnly())});snaps=snaps.slice(0,6);
  try{await IDB.set('snaps',snaps)}catch(e){console.warn(e)}}
async function save(){try{await persist()}catch(e){toast('Không lưu được vào trình duyệt: '+e.message+' – hãy tải file sao lưu JSON!',6000)}renderAll()}

/* ========== tính toán ========== */
const chiCode=u=>nz(u).replace(/^CHI ĐOÀN /,'');
function memberIndex(){
  const a=new Map(),b=new Map();
  for(const m of S.members){const k=m.chi+'|'+nz(m.ten),k2=m.chi+'|'+noAcc(m.ten);(a.get(k)||a.set(k,[]).get(k))?.push(m);(b.get(k2)||b.set(k2,[]).get(k2))?.push(m)}
  return {a,b}}
const scoreNum=s=>{const m=/(\d+(?:[.,]\d+)?)\s*\/\s*(\d+)/.exec(s||'');return m?+m[1].replace(',','.'):-1};
const timeVal=t=>{const m=/(\d+):(\d+)\s+(\d+)\/(\d+)\/(\d+)/.exec(t||'');return m?new Date(+m[5],+m[4]-1,+m[3],+m[1],+m[2]).getTime():0};
const better=(x,y)=>{const dx=x[4]==='Đạt',dy=y[4]==='Đạt';if(dx!==dy)return dx?x:y;return scoreNum(x[5])>=scoreNum(y[5])?x:y};
const memo=new WeakMap();
function computeContest(c){
  if(memo.has(c)&&memo.get(c).v===S._v)return memo.get(c).r;
  const idx=memberIndex(),res=new Map(),unmatched=[],outside=[],seen=new Set(),groups=new Map();
  const byId=new Map(S.members.map(m=>[m.id,m]));
  for(const r of c.rows){
    const dk=r.join('|');if(seen.has(dk))continue;seen.add(dk);
    const chi=chiCode(r[1]),key=chi+'|'+nz(r[0]);
    const ov=c.overrides&&c.overrides[key];
    if(ov&&byId.has(ov)){push(res,byId.get(ov),r,'gán tay');continue}
    if(!/^CHI ĐOÀN /.test(nz(r[1]))||khoaOf(chi)<2023){outside.push(r);continue}
    let ms=idx.a.get(chi+'|'+nz(r[0]));if(!ms)ms=idx.b.get(chi+'|'+noAcc(r[0]));
    if(!ms){unmatched.push({r,key,chi});continue}
    const gk=ms[0].id;(groups.get(gk)||groups.set(gk,{ms,rows:[]}).get(gk)).rows.push(r)}
  for(const {ms,rows} of groups.values()){
    if(ms.length===1){for(const r of rows)push(res,ms[0],r,'')}
    else{rows.sort((x,y)=>timeVal(x[3])-timeVal(y[3]));rows.slice(0,ms.length).forEach((r,i)=>push(res,ms[i],r,'Trùng tên trong chi đoàn – cần kiểm tra'))}}
  const out={res,unmatched,outside};memo.set(c,{v:S._v,r:out});return out}
function push(res,m,r,flag){const o=res.get(m.id);const st=r[4]==='Đạt'?'dat':'chuadat';
  if(!o){res.set(m.id,{st,score:r[5],time:r[3],n:1,flag,row:r})}
  else{o.n++;const b=better(o.row,r);if(b===r){o.st=st;o.score=r[5];o.time=r[3];o.row=r}}}
const members_active=()=>S.members;
const chiKeys=()=>{const set=new Set(S.registry);S.members.forEach(m=>set.add(m.chi));S.errors.forEach(e=>e.chi&&set.add(e.chi));return [...set].filter(c=>khoaOf(c)).sort((a,b)=>khoaOf(b)-khoaOf(a)||a.localeCompare(b,'vi'))};
const sex=m=>m.nam?'Nam':m.nu?'Nữ':'';
const dob=m=>m.nam||m.nu||'';

/* ========== TAB: tổng quan ========== */
let ovF={khoa:new Set([2026,2025,2024,2023]),q:''};
function renderOverview(){
  const el=$('#tab-overview'),keys=chiKeys();
  const per={};keys.forEach(c=>per[c]={n:0,nam:0,nu:0,loi:0});
  S.members.forEach(m=>{const p=per[m.chi]||(per[m.chi]={n:0,nam:0,nu:0,loi:0});p.n++;if(m.nam)p.nam++;else if(m.nu)p.nu++});
  S.errors.forEach(e=>{if(per[e.chi])per[e.chi].loi++});
  const miss=keys.filter(c=>!per[c].n);
  const tot=S.members.length;
  const khoas=[2026,2025,2024,2023];
  const q=ovF.q.toLowerCase();
  let rows='',gt={n:0,nam:0,nu:0,loi:0,c:0};
  for(const k of khoas){ if(!ovF.khoa.has(k))continue;
    const cs=keys.filter(c=>khoaOf(c)===k&&(!q||c.toLowerCase().includes(q)||('k'+k).includes(q)));if(!cs.length)continue;
    const s={n:0,nam:0,nu:0,loi:0};cs.forEach(c=>{for(const f in s)s[f]+=per[c][f]});
    rows+=`<tr class="sub"><td colspan="2">Khóa ${k} (K${k%100}) – ${cs.length} chi đoàn</td><td class="n">${s.n}</td><td class="n">${s.nam}</td><td class="n">${s.nu}</td><td class="n">${s.loi}</td></tr>`;
    cs.forEach((c,i)=>{const p=per[c];rows+=`<tr><td class="c">${i+1}</td><td>${esc(c)}${p.n?'':' <span class="tag t-loi">Chưa có dữ liệu</span>'}</td><td class="n">${p.n}</td><td class="n">${p.nam}</td><td class="n">${p.nu}</td><td class="n">${p.loi||''}</td></tr>`});
    for(const f in s)gt[f]+=s[f];gt.c+=cs.length}
  rows+=`<tr class="tot"><td colspan="2">TỔNG CỘNG (${gt.c} chi đoàn)</td><td class="n">${gt.n}</td><td class="n">${gt.nam}</td><td class="n">${gt.nu}</td><td class="n">${gt.loi}</td></tr>`;
  el.innerHTML=`
  <div class="grid" style="margin-bottom:14px">
    <div class="stat pri"><b>${tot}</b><span>Tổng đoàn viên (đã loại các trường hợp lỗi)</span></div>
    <div class="stat"><b>${keys.length-miss.length}/${keys.length}</b><span>Chi đoàn có dữ liệu</span></div>
    <div class="stat"><b>${S.members.filter(m=>m.nam).length}</b><span>Nam</span></div>
    <div class="stat"><b>${S.members.filter(m=>m.nu).length}</b><span>Nữ</span></div>
    <div class="stat bad"><b>${S.errors.length}</b><span>Đoàn viên bị lỗi (tách riêng)</span></div>
    <div class="stat"><b>${S.contests.length}</b><span>Cuộc thi đã lưu</span></div>
  </div>
  ${miss.length?`<div class="warnbox">⚠ Chi đoàn chưa có dữ liệu đoàn viên: <b>${miss.map(esc).join(', ')}</b>. ${admin?'Vào “Dữ liệu &amp; Sao lưu” để cập nhật bằng file HTML.':'Liên hệ admin để cập nhật.'}</div>`:''}
  <div class="card"><h2>Số lượng đoàn viên theo khóa / chi đoàn</h2>
    <div class="row"><div class="chips" id="ovK">${khoas.map(k=>`<span class="chip ${ovF.khoa.has(k)?'on':''}" data-k="${k}">Khóa ${k}</span>`).join('')}<span class="chip" data-k="all">Tất cả</span></div>
    <input id="ovQ" placeholder="Tìm chi đoàn…" value="${esc(ovF.q)}"><button class="b p" id="ovX">⬇ Xuất Excel</button></div>
    <div class="tw"><table><thead><tr><th class="c">STT</th><th>Chi đoàn</th><th class="n">Đoàn viên</th><th class="n">Nam</th><th class="n">Nữ</th><th class="n">Bị lỗi (tách riêng)</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  $$('#ovK .chip',el).forEach(c=>c.onclick=()=>{const k=c.dataset.k;if(k==='all')[2026,2025,2024,2023].forEach(x=>ovF.khoa.add(x));else ovF.khoa.has(+k)?ovF.khoa.delete(+k):ovF.khoa.add(+k);renderOverview()});
  $('#ovQ',el).oninput=e=>{ovF.q=e.target.value;const p=e.target.selectionStart;renderOverview();const i=$('#ovQ');i.focus();i.setSelectionRange(p,p)};
  $('#ovX',el).onclick=()=>exportOverview(per,khoas.filter(k=>ovF.khoa.has(k)),q);
}

/* ========== Xuất Excel (ExcelJS) ========== */
const FONT=(o={})=>({name:'Times New Roman',size:12,...o});
const BORDER={top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'}};
function addTitle(ws,lines,ncol){
  lines.forEach((l,i)=>{const r=ws.addRow([l.t]);ws.mergeCells(r.number,1,r.number,ncol);const c=r.getCell(1);c.font=FONT({size:l.size||12,bold:!!l.bold,italic:!!l.italic});c.alignment={horizontal:l.left?'left':'center',vertical:'middle',wrapText:true};r.height=l.h||(l.size?l.size*1.7:19)});
  ws.addRow([])}
function addTable(ws,head,rows,o={}){
  const h=ws.addRow(head);h.height=34;h.eachCell(c=>{c.font=FONT({bold:true});c.border=BORDER;c.alignment={horizontal:'center',vertical:'middle',wrapText:true};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFE7ECF5'}}});
  const hn=h.number;
  rows.forEach(r=>{const x=ws.addRow(r.v||r);x.eachCell({includeEmpty:true},(c,i)=>{c.font=FONT({bold:!!r.bold});c.border=BORDER;const al=(o.center||[]).includes(i)?'center':'left';c.alignment={horizontal:al,vertical:'middle',wrapText:true};if(r.fc)c.fill={type:'pattern',pattern:'solid',fgColor:{argb:r.fc}}})});
  ws.views=[{state:'frozen',ySplit:hn}];
  ws.pageSetup={orientation:'landscape',paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0,margins:{left:.4,right:.4,top:.5,bottom:.5,header:.2,footer:.2}};
  ws.headerFooter={oddFooter:'&CTrang &P / &N'};
}
async function saveWb(wb,name){const buf=await wb.xlsx.writeBuffer();download(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),name)}
async function exportOverview(per,khoas,q){
  const wb=new ExcelJS.Workbook();const ws=wb.addWorksheet('Thống kê đoàn viên');
  const cols=[7,28,14,10,10,16];cols.forEach((w,i)=>ws.getColumn(i+1).width=w);
  let n=0;const body=[];
  for(const k of khoas){const cs=chiKeys().filter(c=>khoaOf(c)===k&&(!q||c.toLowerCase().includes(q)));if(!cs.length)continue;
    const s={n:0,nam:0,nu:0,loi:0};cs.forEach(c=>{for(const f in s)s[f]+=per[c][f]});n+=s.n;
    body.push({v:[`Khóa ${k}`,'',s.n,s.nam,s.nu,s.loi],bold:true,fc:'FFF3F5FA'});cs.forEach((c,i)=>body.push([i+1,c,per[c].n,per[c].nam,per[c].nu,per[c].loi||'']))}
  const T=body.filter(b=>b.bold).reduce((a,b)=>{for(let i=2;i<6;i++)a[i]+=+b.v[i]||0;return a},[0,0,0,0,0,0]);
  body.push({v:['TỔNG CỘNG','',T[2],T[3],T[4],T[5]],bold:true,fc:'FFE7ECF5'});
  addTitle(ws,[{t:'THỐNG KÊ SỐ LƯỢNG ĐOÀN VIÊN',size:15,bold:true},{t:'Đoàn khoa Ngoại ngữ – Khóa '+khoas.join(', '),bold:true},{t:'Thời gian xuất file: '+fmtNow(),italic:true},{t:'Tổng số lượng đoàn viên: '+n,bold:true}],6);
  addTable(ws,['STT','Chi đoàn','Số đoàn viên','Nam','Nữ','Bị lỗi (tách riêng)'],body,{center:[1,3,4,5,6]});
  await saveWb(wb,`Thong_ke_doan_vien_${stamp()}.xlsx`)}

const CT_HEAD=['STT','Họ và tên','Đơn vị','Đối tượng','Thời gian nộp bài','Trạng thái','Điểm'];
async function parseContestXlsx(buf,fileName){
  const wb=new ExcelJS.Workbook();const chk=[];let rows=[];
  try{await wb.xlsx.load(buf)}catch(e){return {fileName,chk:[[false,'Không đọc được file Excel: '+e.message]],rows:[]}}
  const ws=wb.worksheets[0];if(!ws)return {fileName,chk:[[false,'File không có trang tính']],rows:[]};
  const hd=[1,2,3,4,5,6,7].map(i=>String(ws.getRow(1).getCell(i).value??'').trim());
  const okH=CT_HEAD.every((h,i)=>hd[i]===h);chk.push([okH,okH?'Đúng form: '+CT_HEAD.join(' | '):'Sai tiêu đề cột. Cần: '+CT_HEAD.join(' | ')+' — Đọc được: '+hd.join(' | ')]);
  if(!okH)return {fileName,chk,rows};
  let bad=0;const cv=v=>{if(v==null)return '';if(typeof v==='object'){if(v.richText)return v.richText.map(t=>t.text).join('');if(v.result!=null)return String(v.result);if(v instanceof Date)return `${pad(v.getUTCHours())}:${pad(v.getUTCMinutes())} ${pad(v.getUTCDate())}/${pad(v.getUTCMonth()+1)}/${v.getUTCFullYear()}`}return String(v).trim()};
  ws.eachRow({includeEmpty:false},(row,n)=>{if(n===1)return;const r=[2,3,4,5,6,7].map(i=>cv(row.getCell(i).value));if(!r[0])return;
    if(!/^(Đạt|Không đạt)$/.test(r[4])||!/^\d+(?:[.,]\d+)?\s*\/\s*\d+$/.test(r[5])||!/^\d{1,2}:\d{2} \d{1,2}\/\d{1,2}\/\d{4}$/.test(r[3]))bad++;rows.push(r)});
  chk.push([rows.length>0,`Số dòng dữ liệu: ${rows.length}`]);
  chk.push([bad===0,bad?`${bad} dòng sai định dạng (Trạng thái phải là “Đạt/Không đạt”, Điểm dạng “160/300”, Thời gian “hh:mm dd/mm/yyyy”)`:'Định dạng Trạng thái / Điểm / Thời gian hợp lệ']);
  return {fileName,chk,rows,ok:okH&&rows.length>0&&bad===0}}
function uploadContest(){
  pick('.zip,.xlsx',true,async files=>{const items=[];
    for(const f of files){const buf=await f.arrayBuffer();
      if(/\.zip$/i.test(f.name)){const z=await JSZip.loadAsync(buf,{decodeFileName:b=>new TextDecoder('utf-8').decode(b)});
        for(const [p,e] of Object.entries(z.files)){if(e.dir||!/\.xlsx$/i.test(p)||/(^|\/)~\$/.test(p))continue;items.push(await parseContestXlsx(await e.async('arraybuffer'),p.split('/').pop()))}}
      else if(/\.xlsx$/i.test(f.name))items.push(await parseContestXlsx(buf,f.name))}
    if(!items.length)return toast('Không tìm thấy file .xlsx hợp lệ');
    reviewContests(items)})}

    <label style="display:block;margin-top:6px"><input type="checkbox" data-ok="${i}" checked> Duyệt file này</label>`:'<div class="bad-t" style="margin-top:6px">File không đúng form – không thể duyệt.</div>'}</div>`).join('');
  modal(`<h3>Kiểm tra file cuộc thi</h3>${html}<div class="mf"><button class="b" onclick="closeModal()">Hủy</button><button class="b p" id="okC">Duyệt &amp; lưu</button></div>`,r=>{
    $('#okC').onclick=async()=>{const sel=items.filter((it,i)=>it.ok&&$(`[data-ok="${i}"]`)?.checked);if(!sel.length)return toast('Chưa chọn file nào');

/* ----- cập nhật đoàn viên từ HTML ----- */
function parseYumHtml(text,fileName){
  const chk=[],doc=new DOMParser().parseFromString(text,'text/html');
  const lt=doc.getElementById('headerlefttable'),bt=doc.getElementById('bodytable');
  const base=fileName.replace(/\.html?$/i,'');
  if(!lt||!bt){return {fileName,chk:[[false,'Không đúng form danh sách đoàn viên của hệ thống YUM (thiếu bảng dữ liệu)']],members:[],level:'err'}}
  const lrows=[...lt.querySelectorAll('tr')].filter(r=>r.querySelector('td.col-big-1')&&r.querySelector('div.truncate[title]'));
  const brows=[...bt.querySelectorAll('tr')].filter(r=>r.querySelectorAll('td').length>=25);
  const txt=doc.body.textContent.replace(/\s+/g,' ');
  const hd=[...bt.querySelectorAll('tr')].filter(r=>r.querySelectorAll('td').length<5).map(r=>r.textContent.replace(/\s+/g,' ').trim()).find(t=>/Chi đoàn/i.test(t))||'';
  const hm=/Chi đoàn\s+(\S+)\s*\((\d+)\s*đoàn viên\)/i.exec(hd);
  const pm=/Hiển thị từ (\d+) đến (\d+) của (\d+)/.exec(txt);
  let level='ok';
  const chi=hm?nz(hm[1]):nz(base);const declared=hm?+hm[2]:pm?+pm[3]:null;
  chk.push([!!hm,hm?`Chi đoàn: ${chi} (${declared} đoàn viên theo tiêu đề)`:'Không đọc được tên chi đoàn trong tiêu đề — dùng tên file']);if(!hm)level='warn';
  if(!khoaOf(chi)){chk.push([false,'Mã chi đoàn không có khóa hợp lệ']);level='err'}
  if(hm&&/^ĐH/i.test(nz(base))&&nz(base)!==chi){chk.push([false,`Tên file (${nz(base)}) khác chi đoàn trong tiêu đề (${chi}) – có thể đã lưu nhầm trang. Hãy tải lại đúng chi đoàn.`]);level='err'}
  if(!lrows.length||lrows.length!==brows.length){chk.push([false,`Số dòng tên (${lrows.length}) và dòng dữ liệu (${brows.length}) không khớp / bảng rỗng`]);level='err'}
  const members=[];
  if(level!=='err'){lrows.forEach((lr,i)=>{const c=[...brows[i].querySelectorAll('td')].map(t=>t.textContent.replace(/\s+/g,' ').trim());
    members.push({id:c[0],ten:nz(lr.querySelector('div.truncate[title]').textContent),chi,nam:c[2]||'',nu:c[3]||'',email:c[27]||'',sdt:c[28]||'',the:c[1]||''})});
    const badId=members.filter(m=>!/^\d{4,}$/.test(m.id)).length;
    chk.push([badId===0,badId?`${badId} dòng có mã định danh không hợp lệ`:`Đọc được ${members.length} đoàn viên, mã định danh hợp lệ`]);if(badId){level='err'}
    const dupId=members.length-new Set(members.map(m=>m.id)).size;if(dupId){chk.push([false,`${dupId} mã định danh bị trùng trong file`]);level='err'}
    if(declared!=null&&declared!==members.length){chk.push([false,`Thiếu dữ liệu: tiêu đề ghi ${declared} đoàn viên nhưng file chỉ có ${members.length} (có thể chưa chọn hiển thị hết các trang)`]);if(level==='ok')level='warn'}}
  return {fileName,chi,chk,members,level,declared}}
function uploadHtml(){
  pick('.html,.htm,.zip',true,async files=>{toast('Đang đọc file…',1500);const items=[];
    for(const f of files){
      if(/\.zip$/i.test(f.name)){const z=await JSZip.loadAsync(await f.arrayBuffer(),{decodeFileName:b=>new TextDecoder('utf-8').decode(b)});
        for(const [p,e] of Object.entries(z.files)){if(e.dir||!/\.html?$/i.test(p))continue;items.push(parseYumHtml(await e.async('string'),p.split('/').pop()));await new Promise(r=>setTimeout(r))}}
      else{items.push(parseYumHtml(await f.text(),f.name));await new Promise(r=>setTimeout(r))}}
    if(!items.length)return toast('Không tìm thấy file HTML');
    reviewHtml(items)})}
function reviewHtml(items){
  const errIds=new Set(S.errors.map(e=>e.id));
  // phát hiện file trùng nội dung với file khác (VD: lưu nhầm cùng một trang cho 2 chi đoàn)
  const sig=it=>it.members.slice(0,8).map(m=>m.id).join(',');
  items.forEach((a,i)=>{if(a.level==='err'||!a.members.length)return;
    items.forEach((b,j)=>{if(j<i&&b.level!=='err'&&b.members.length&&sig(a)===sig(b)){a.level='err';a.chk.push([false,`Nội dung TRÙNG với file “${b.fileName}” (cùng danh sách đoàn viên) – có thể đã lưu nhầm trang. Hãy tải lại đúng chi đoàn.`])}});
    const byChi=items.filter((b,j)=>j<i&&b.chi===a.chi&&b.level!=='err');if(byChi.length){a.level='err';a.chk.push([false,'Trùng chi đoàn '+a.chi+' với một file khác trong lô này'])}});
  items.forEach(it=>{if(it.level==='err')return;
    const cur=S.members.filter(m=>m.chi===it.chi),curIds=new Set(cur.map(m=>m.id)),newM=it.members.filter(m=>!errIds.has(m.id)),newIds=new Set(newM.map(m=>m.id));
    it.skipErr=it.members.length-newM.length;it.final=newM;
    it.added=newM.filter(m=>!curIds.has(m.id)).length;it.removed=cur.filter(m=>!newIds.has(m.id)).length;it.keep=newM.length-it.added;it.old=cur.length;
    it.moved=newM.filter(m=>!curIds.has(m.id)&&S.members.some(x=>x.id===m.id&&x.chi!==it.chi)).length;
    it.isNew=!S.registry.includes(it.chi)&&!cur.length});
  const lv={ok:'#b9e3cc',warn:'#f1d49b',err:'#f0b8b2'};
  const html=items.map((it,i)=>`<div class="card" style="border-color:${lv[it.level]}"><b>📄 ${esc(it.fileName)}</b>${it.chi?` → <b>${esc(it.chi)}</b>`:''}
   ${it.chk.map(c=>`<div class="${c[0]?'ok-t':'bad-t'}">${c[0]?'✔':'✖'} ${esc(c[1])}</div>`).join('')}
   ${it.level!=='err'?`<div style="margin:6px 0">Hiện có <b>${it.old}</b> → sau cập nhật <b>${it.final.length}</b> đoàn viên: <span class="ok-t">+${it.added} thêm mới</span> · <span class="${it.removed?'bad-t':'note'}">−${it.removed} không còn trong file</span> · ${it.keep} giữ nguyên${it.moved?` · ${it.moved} chuyển từ chi đoàn khác`:''}${it.skipErr?` · <span class="warn-t">${it.skipErr} đang trong danh sách lỗi (bỏ qua)</span>`:''}${it.isNew?' · <span class="warn-t">chi đoàn mới</span>':''}</div>
   <label><input type="checkbox" data-hk="${i}" ${it.level==='ok'?'checked':''}> Duyệt cập nhật chi đoàn này${it.level==='warn'?' <span class="warn-t">(có cảnh báo – nên kiểm tra)</span>':''}</label>`:'<div class="bad-t" style="margin-top:6px">Không thể duyệt file này.</div>'}</div>`).join('');
  const okn=items.filter(i=>i.level!=='err').length;
  modal(`<h3>Kiểm tra file cập nhật đoàn viên (${items.length} file · ${okn} hợp lệ)</h3>${html}<div class="mf"><button class="b" onclick="closeModal()">Hủy</button><button class="b p" id="okH">Duyệt &amp; cập nhật</button></div>`,()=>{
    $('#okH').onclick=async()=>{const sel=items.filter((it,i)=>it.level!=='err'&&$(`[data-hk="${i}"]`)?.checked);if(!sel.length)return toast('Chưa chọn chi đoàn nào');
      await commit('Cập nhật đoàn viên từ HTML ('+sel.length+' chi đoàn)');
      for(const it of sel){const incoming=new Set(it.final.map(m=>m.id));
        S.members=S.members.filter(m=>m.chi!==it.chi&&!incoming.has(m.id));S.members.push(...it.final);
        if(!S.registry.includes(it.chi))S.registry.push(it.chi)}
      // sắp xếp theo thứ tự chi đoàn để giữ thứ tự ổn định
      const ord=new Map(chiKeys().map((c,i)=>[c,i]));S.members.sort((a,b)=>(ord.get(a.chi)??999)-(ord.get(b.chi)??999));
      S._v++;closeModal();await save();toast(`Đã cập nhật ${sel.length} chi đoàn · tổng ${S.members.length} đoàn viên`,5000)}})}

/* ========== khởi động / admin ========== */
function loadSeed(){const d=clone(window.SEED);S.members=d.members;S.errors=d.errors;S.contests=d.contests;S.registry=d.registry}
function setAdmin(on){admin=on;document.body.classList.toggle('admin',on);$('#btnAdmin').textContent=on?'🔓 Đăng xuất Admin':'🔐 Đăng nhập Admin';$('#adminState').textContent=on?'Chế độ Admin':'';renderAll()}
$('#btnAdmin').onclick=()=>{if(admin)return setAdmin(false);
  modal(`<h3>Đăng nhập Admin</h3><div class="row" style="flex-wrap:nowrap"><input id="pwI" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Nhập mật khẩu" style="flex:1;font-size:16px"><button class="b" id="pwEye" type="button" title="Ẩn/hiện">👁</button></div>
  <p class="note">Mật khẩu mặc định: <b>admin123</b> (gõ chữ thường, không dấu cách). Nếu đã đổi mà quên, bấm “Quên mật khẩu” để đặt lại về mặc định — dữ liệu không bị mất.</p>
  <div class="mf"><button class="b" id="pwFg">Quên mật khẩu</button><button class="b" onclick="closeModal()">Hủy</button><button class="b p" id="pwOk">Đăng nhập</button></div>`,()=>{
    const inp=$('#pwI');let hide=false;const sync=()=>{inp.style.webkitTextSecurity=hide?'disc':'none'};sync();
    const go=async()=>{if(await hashStr(inp.value.trim())===S.settings.pwd){closeModal();setAdmin(true)}else{toast('Sai mật khẩu – thử lại (mặc định: admin123)');inp.select()}};
    $('#pwOk').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)go()};$('#pwEye').onclick=()=>{hide=!hide;sync()};
    $('#pwFg').onclick=async()=>{if(confirm('Đặt lại mật khẩu admin về “admin123”?')){S.settings.pwd=await hashStr('admin123');await persist();toast('Đã đặt lại: admin123')}};
    setTimeout(()=>inp.focus(),50)})};
$$('#tabs button').forEach(b=>b.onclick=()=>{$$('#tabs button').forEach(x=>x.classList.toggle('on',x===b));['overview','contest','errors','data'].forEach(t=>$('#tab-'+t).classList.toggle('hide',t!==b.dataset.t))});
function renderAll(){
  if($('#tabs .on')?.dataset.t==='data'&&!admin){$('#tabs button').click()}
  renderOverview();renderContest();renderErrors();renderData()}
(async function init(){
  try{await IDB.open();const st=await IDB.get('state');snaps=(await IDB.get('snaps'))||[];
    if(st&&st.members){S=st}else{loadSeed();S.settings={pwd:await hashStr('admin123'),lastBackup:null};await persist()}}
  catch(e){loadSeed();S.settings={pwd:await hashStr('admin123'),lastBackup:null};toast('Trình duyệt không cho lưu dữ liệu – dùng chế độ tạm thời',6000)}
  S._v=1;S.settings=S.settings||{};if(!S.settings.pwd)S.settings.pwd=await hashStr('admin123');
  renderAll()})();
</script>
